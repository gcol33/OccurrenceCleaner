url: https://gillescolling.com/OccurrenceCleaner/
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes
  includes:
    in_header: |
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
figures:
  dev: svglite::svglite
  fig.ext: svg
  bg: '#F5F6F8'
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    - news
    right:
    - search
    - github
    - lightswitch
reference:
- title: Flagging
  contents:
  - flag_occurrences
  - default_tests
  - occ_columns
- title: Tests
  contents:
  - test_invalid
  - test_zero
  - test_equal
  - test_capital
  - test_centroid
  - test_institution
  - test_gbif_headquarters
  - test_sea
  - test_urban
  - test_country_mismatch
  - test_duplicate
  - test_gbif_issue
  - test_basis
  - test_establishment
  - test_age_equal
- title: Rules and tallies
  contents:
  - tally_flags
  - summary.occ_flags
  - plot.occ_summary
  - flag_mask
  - has_flag
  - flag_tests
- title: On-disk output
  contents:
  - read_flagged
  - flagged_table
- title: Reference data
  contents:
  - reference_info
  - reference_points
  - download_reference
- title: Package
  contents: OccurrenceCleaner-package
articles:
- title: Workflows
  navbar: Workflows
  contents:
  - quickstart
  - gbif-workflow
  - fossils
  - rules
  - on-disk
- title: Background
  navbar: Background
  contents:
  - tests
  - reference-data
  - gazetteers
  - coordinatecleaner
