url: https://gillescolling.com/OccurrenceCleaner/
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes
  includes:
    in_header: |
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
figures:
  dev: svglite::svglite
  fig.ext: svg
  bg: '#F5F6F8'
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    - news
    right:
    - search
    - github
    - lightswitch
reference:
- title: Flagging
  contents:
  - flag_occurrences
  - default_tests
  - occ_columns
- title: Rules and tallies
  contents:
  - tally_flags
  - flag_mask
  - has_flag
  - flag_tests
- title: On-disk output
  contents:
  - read_flagged
  - flagged_table
- title: Reference data
  contents:
  - reference_info
  - download_reference
- title: Package
  contents: OccurrenceCleaner-package
articles:
- title: Articles
  contents: quickstart
