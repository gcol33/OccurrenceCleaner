on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: CoordinateCleaner-devel

permissions: read-all

jobs:
  equivalence:
    runs-on: ubuntu-latest
    name: equivalence against CoordinateCleaner (GitHub)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: github::ropensci/CoordinateCleaner, any::testthat
          needs: check
      - name: CoordinateCleaner version under test
        run: |
          d <- packageDescription("CoordinateCleaner")
          cat("CoordinateCleaner", d$Version, d$RemoteSha, "\n")
        shell: Rscript {0}
      - name: Tests
        run: testthat::test_local(stop_on_failure = TRUE)
        shell: Rscript {0}
